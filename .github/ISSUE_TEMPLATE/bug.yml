name: Bug report
description: Report something that is broken
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include API keys, secrets, or private account data.
  - type: input
    id: version
    attributes:
      label: Omakade version
      placeholder: 1.4.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      placeholder: Omarchy version, active theme, native or Flatpak launcher
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Game source
      options:
        - Steam
        - GOG
        - Lutris
        - Heroic
        - Faugus
        - RetroArch
        - PCSX2
        - Ryujinx
        - Battle.net
        - Omakade UI or packaging
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include the shortest steps that reproduce the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Copy only relevant text from Settings. Remove paths or IDs you do not want public.
