name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Compiler output is validated against source/dependencies and compiler
  # content by ccache; package builds stay clean and all tests still run.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # CCACHE_BASEDIR stays unset, as in CI, so the outputs CI saves on main are hits
  # here and the source-inspection tests keep their absolute __FILE__ paths.
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 500M
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  ARCH_PACKAGES: >-
    appstream arch-audit base-devel ccache cmake desktop-file-utils git github-cli
    jq layer-shell-qt libsecret libzip ninja pacman-contrib pkgconf python qt6-base
    qt6-declarative qt6-imageformats qt6-svg qt6-wayland sdl3 ttf-dejavu
    wayland wayland-protocols
  # The package release. Raise it to rebuild the same version; README.md and
  # omastore.toml name the package file, and the package job checks they match.
  PKGREL: "1"

# Tests and packaging run as separate jobs so neither waits on the other.
# Publishing still needs both to pass on both architectures.
# x86_64 builds on Omarchy's stable channel so the package runs on stable, rc
# and edge. A build against newer Qt fails to start on older Qt. -uu lets the
# stable snapshot downgrade packages newer than it.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    name: Test (${{ matrix.check }})
    # As in CI, current Arch only warns about newer Qt, so it can't block a release.
    continue-on-error: ${{ matrix.check == 'x86_64 current Arch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: x86_64
            arch: x86_64
            packages: omarchy-stable
            runner: ubuntu-24.04
            container: archlinux@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a
          - check: x86_64 current Arch
            arch: x86_64
            packages: arch
            runner: ubuntu-24.04
            container: archlinux@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a
          - check: aarch64
            arch: aarch64
            packages: arch
            runner: ubuntu-24.04-arm
            container: menci/archlinuxarm:base-devel@sha256:5dda87d4b360dff28fe5ce27a20041949aa770a785c52daf82fc9956b2534c39
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Use Omarchy stable packages
        if: matrix.packages == 'omarchy-stable'
        run: |
          # shellcheck disable=SC2016 # $repo and $arch are for pacman, not the shell.
          echo 'Server = https://stable-mirror.omarchy.org/$repo/os/$arch' > /etc/pacman.d/mirrorlist
      - name: Install dependencies
        run: |
          # shellcheck disable=SC2086 # The package list splits into words on purpose.
          pacman -Syyuu --disable-sandbox --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # CI saves these from main, the one scope a tag or dispatch run can read.
      - name: Restore compiler outputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-v2-${{ matrix.packages }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-v2-${{ matrix.packages }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Build
        run: |
          cmake --preset release
          cmake --build --preset release
      - name: Add an unprivileged test user
        # As root, the cases that check unreadable files and device nodes would skip.
        run: |
          useradd --create-home tester
          chown -R tester:tester "$GITHUB_WORKSPACE"
      - name: Test
        run: |
          runuser -u tester -- ctest --preset release --parallel 8 --output-junit test-results.xml
          # ctest counts a QSKIP as a pass, so check that these really ran.
          runuser -u tester -- python tools/ci/require-qt-cases.py \
            build/release/tests/omakade_guide_button_tests listenerRetriesAControllerItCannotOpenYet
          runuser -u tester -- python tools/ci/require-qt-cases.py \
            build/release/tests/omakade_save_set_tests unreadableFoldersRefuseSnapshotAndRestore
          python tests/SbomGeneratorTests.py
          python tools/ci/CiToolsTests.py
          desktop-file-validate packaging/io.github.tsouth89.Omakade.desktop
          appstreamcli validate packaging/io.github.tsouth89.Omakade.metainfo.xml
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ github.job }}-${{ matrix.packages }}-${{ runner.arch }}
          path: '**/test-results.xml'
          if-no-files-found: ignore
          retention-days: 7

  package:
    timeout-minutes: 60
    name: Package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            packages: omarchy-stable
            runner: ubuntu-24.04
            container: archlinux@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a
          - arch: aarch64
            packages: arch
            runner: ubuntu-24.04-arm
            container: menci/archlinuxarm:base-devel@sha256:5dda87d4b360dff28fe5ce27a20041949aa770a785c52daf82fc9956b2534c39
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - name: Use Omarchy stable packages
        if: matrix.packages == 'omarchy-stable'
        run: |
          # shellcheck disable=SC2016 # $repo and $arch are for pacman, not the shell.
          echo 'Server = https://stable-mirror.omarchy.org/$repo/os/$arch' > /etc/pacman.d/mirrorlist
      - name: Install dependencies
        run: |
          # shellcheck disable=SC2086 # The package list splits into words on purpose.
          pacman -Syyuu --disable-sandbox --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cache compiler outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          # makepkg's flags and paths differ from the test builds, so its outputs
          # are kept apart from the ones CI saves.
          key: ccache-v2-package-${{ matrix.packages }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-v2-package-${{ matrix.packages }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Check release version and architecture
        run: |
          project_version="$(sed -n 's/^project(Omakade VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
          version="$project_version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$project_version"
          fi
          test "$(uname -m)" = "$PACKAGE_ARCH"
          grep -q "<release version=\"$version\"" packaging/io.github.tsouth89.Omakade.metainfo.xml
          grep -q "^## $version$" CHANGELOG.md
          grep -q "omakade-$version-$PKGREL-x86_64.pkg.tar.zst" README.md
          # OmaStore fills in only {version}, so its patterns carry the pkgrel.
          for arch in x86_64 aarch64; do
            grep -qxF "asset = \"omakade-{version}-$PKGREL-$arch.pkg.tar.zst\"" omastore.toml
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Create source and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=tar --prefix="omakade-$VERSION/" \
            --output="omakade-$VERSION.tar" "$GITHUB_SHA"
          gzip -n "omakade-$VERSION.tar"
          source_sha="$(sha256sum "omakade-$VERSION.tar.gz" | cut -d ' ' -f 1)"
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@PKGREL@/$PKGREL/g" \
            -e "s/@SOURCE_SHA256@/$source_sha/g" \
            packaging/arch/PKGBUILD.in > packaging/arch/PKGBUILD
          cp "omakade-$VERSION.tar.gz" packaging/arch/
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cp /etc/makepkg.conf /tmp/omakade-makepkg.conf
          sed -i "s/^PKGEXT=.*/PKGEXT='.pkg.tar.zst'/" /tmp/omakade-makepkg.conf
          runuser -u builder -- bash -lc "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --config /tmp/omakade-makepkg.conf --cleanbuild --noconfirm"
          package_file="packaging/arch/omakade-$VERSION-$PKGREL-$PACKAGE_ARCH.pkg.tar.zst"
          test -f "$package_file"
          echo "PACKAGE_FILE=$package_file" >> "$GITHUB_ENV"
      - name: Record the oldest glibc and Qt the package runs on
        run: |
          abi="$(tools/ci/package-abi.sh "$PACKAGE_FILE")"
          needed_glibc="$(sed -n 's/^glibc=//p' <<<"$abi")"
          needed_qt="$(sed -n 's/^qt=//p' <<<"$abi")"
          echo "NEEDED_GLIBC=$needed_glibc" >> "$GITHUB_ENV"
          echo "NEEDED_QT=$needed_qt" >> "$GITHUB_ENV"
          needs="glibc $needed_glibc or newer and qt6-base $needed_qt or newer"
          echo "- $PACKAGE_ARCH: $needs" > "requirements-$PACKAGE_ARCH.md"
          echo "The $PACKAGE_ARCH package needs $needs." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the package runs on Omarchy stable
        if: matrix.arch == 'x86_64'
        run: |
          # Read stable's versions from its mirror, not from the build container.
          stable_version() {
            curl -fsSL "https://stable-mirror.omarchy.org/$1/os/x86_64/$1.db" | bsdtar -tf - \
              | sed -nE "s|^$2-([0-9]+\.[0-9]+)[^/]*/$|\1|p" | head -n 1
          }
          newest() { sort -V | tail -n 1; }
          stable_qt="$(stable_version extra qt6-base)"
          stable_glibc="$(stable_version core glibc)"
          test -n "$stable_qt" && test -n "$stable_glibc"
          echo "Omarchy stable has Qt $stable_qt and glibc $stable_glibc; the package needs Qt $NEEDED_QT and glibc $NEEDED_GLIBC."
          test "$(printf '%s\n' "$NEEDED_QT" "$stable_qt" | newest)" = "$stable_qt"
          test "$(printf '%s\n' "$NEEDED_GLIBC" "$stable_glibc" | newest)" = "$stable_glibc"
      - name: Test install, upgrade, removal, and reinstall
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fails on any gh error; only a missing release or package means a clean install.
          baseline="$(python tools/ci/previous-release.py --repo "$GITHUB_REPOSITORY" \
            --arch "$PACKAGE_ARCH" --current-tag "$GITHUB_REF_NAME")"
          if test -n "$baseline"; then
            IFS=$'\t' read -r previous_tag previous_name <<<"$baseline"
            echo "Upgrade test from $previous_name ($previous_tag)." >> "$GITHUB_STEP_SUMMARY"
            mkdir previous-release
            gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "$previous_name" --dir previous-release
            previous_package="previous-release/$previous_name"
            pacman -U --noconfirm "$previous_package"
            QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software omakade --smoke-test
          else
            echo "No previous $PACKAGE_ARCH package exists; testing a clean install." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          pacman -U --noconfirm "$PACKAGE_FILE"
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software omakade --smoke-test
          test -f /usr/lib/systemd/user/omakade-guide-button.service
          omakade-guide-button --list
          test -f /usr/share/omakade/omarchy-plugin/manifest.json
          python3 -c "import json; assert json.load(open('/usr/share/omakade/omarchy-plugin/manifest.json'))['id'] == 'omakade.guide'"
          pacman -U --noconfirm "$PACKAGE_FILE"
          pacman -R --noconfirm omakade
          test ! -e /usr/bin/omakade
          test ! -e /usr/bin/omakade-guide-button
          test ! -e /usr/lib/systemd/user/omakade-guide-button.service
          test ! -e /usr/share/omakade/omarchy-plugin
          pacman -U --noconfirm "$PACKAGE_FILE"
      - name: Generate package SBOM
        run: >-
          python scripts/generate-spdx-sbom.py
          "$PACKAGE_FILE"
          "omakade-$VERSION-$PACKAGE_ARCH.spdx.json"
      - name: Check Arch runtime vulnerabilities
        run: |
          pactree --unique omakade \
            | sed -E 's/[<>=].*$//' \
            | while read -r package; do pacman -Qq "$package" 2>/dev/null || true; done \
            | sort -u > /tmp/omakade-runtime-packages
          arch-audit --upgradable --json > /tmp/arch-audit.json
          jq --rawfile runtime /tmp/omakade-runtime-packages '
            ($runtime | split("\n") | map(select(length > 0))) as $runtime
            | [.[]
                | select(.severity == "High" or .severity == "Critical")
                | select(.packages | any(. as $package | $runtime | index($package)))]
          ' /tmp/arch-audit.json > /tmp/omakade-vulnerabilities.json
          jq . /tmp/omakade-vulnerabilities.json
          test "$(jq length /tmp/omakade-vulnerabilities.json)" -eq 0
      - name: Scan package SBOM
        # Arch advisories are a baseline for ARM64, not complete Arch Linux ARM coverage.
        env:
          GRYPE_DISTRO: arch:rolling
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: omakade-${{ env.VERSION }}-${{ matrix.arch }}.spdx.json
          fail-build: true
          only-fixed: true
          output-format: table
          severity-cutoff: high
      - name: Prepare architecture artifacts
        run: |
          mkdir dist
          cp "$PACKAGE_FILE" dist/
          cp "omakade-$VERSION-$PACKAGE_ARCH.spdx.json" dist/
          cp "requirements-$PACKAGE_ARCH.md" dist/
          cd dist
          sha256sum "$(basename "$PACKAGE_FILE")" \
            "omakade-$VERSION-$PACKAGE_ARCH.spdx.json" > "SHA256SUMS-$PACKAGE_ARCH"
          if test "$PACKAGE_ARCH" = x86_64; then
            cp "../omakade-$VERSION.tar.gz" .
            cp "../packaging/arch/PKGBUILD" "PKGBUILD-$VERSION"
            cp ../packaging/arch/omakade.install .
          fi
      - name: Attest architecture artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/SHA256SUMS-${{ matrix.arch }}
      - name: Upload architecture artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

  publish:
    timeout-minutes: 10
    name: Publish release
    needs: [test, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify artifacts and create aggregate checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd dist
          test -f "omakade-$version-$PKGREL-x86_64.pkg.tar.zst"
          test -f "omakade-$version-$PKGREL-aarch64.pkg.tar.zst"
          test -f "omakade-$version-x86_64.spdx.json"
          test -f "omakade-$version-aarch64.spdx.json"
          test -f "omakade-$version.tar.gz"
          test -f "PKGBUILD-$version"
          test -f omakade.install
          sha256sum -c SHA256SUMS-x86_64
          sha256sum -c SHA256SUMS-aarch64
          cat SHA256SUMS-x86_64 SHA256SUMS-aarch64 > SHA256SUMS
          sha256sum "omakade-$version.tar.gz" "PKGBUILD-$version" omakade.install >> SHA256SUMS
          awk -v heading="## $version" '$0 == heading {copy=1; next} /^## /{copy=0} copy' \
            ../CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md
          test -s requirements-x86_64.md
          test -s requirements-aarch64.md
          {
            printf '\n### Requirements\n\n'
            cat requirements-x86_64.md requirements-aarch64.md
          } >> RELEASE_NOTES.md
      - name: Attest complete release
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/omakade-*.tar.gz
          dist/omakade-*.pkg.tar.zst
          dist/omakade-*.spdx.json
          dist/PKGBUILD-*
          dist/omakade.install
          dist/SHA256SUMS
          dist/SHA256SUMS-*
          --repo "$GITHUB_REPOSITORY"
          --title "Omakade ${GITHUB_REF_NAME#v}"
          --notes-file dist/RELEASE_NOTES.md
