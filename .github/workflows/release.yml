name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          appstream base-devel cmake desktop-file-utils git github-cli libsecret
          libzip ninja pkgconf qt6-base qt6-declarative qt6-imageformats qt6-svg qt6-wayland
          sdl3 ttf-dejavu
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/^project(Omakade VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
          test "$version" = "$project_version"
          grep -q "<release version=\"$version\"" packaging/io.github.tsouth89.Omakade.metainfo.xml
          grep -q "^## $version$" CHANGELOG.md
          grep -q "omakade-$version-1-x86_64.pkg.tar.zst" README.md
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          cmake --preset release
          cmake --build --preset release
          ctest --preset release
          desktop-file-validate packaging/io.github.tsouth89.Omakade.desktop
          appstreamcli validate packaging/io.github.tsouth89.Omakade.metainfo.xml
      - name: Create source and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=tar --prefix="omakade-$VERSION/" \
            --output="omakade-$VERSION.tar" "$GITHUB_SHA"
          gzip -n "omakade-$VERSION.tar"
          source_sha="$(sha256sum "omakade-$VERSION.tar.gz" | cut -d ' ' -f 1)"
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SOURCE_SHA256@/$source_sha/g" \
            packaging/arch/PKGBUILD.in > packaging/arch/PKGBUILD
          cp "omakade-$VERSION.tar.gz" packaging/arch/
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -lc "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --cleanbuild --noconfirm"
          package_file="$(find packaging/arch -maxdepth 1 -name 'omakade-[0-9]*-x86_64.pkg.tar.zst' -print -quit)"
          previous_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          mkdir previous-release
          gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'omakade-*-x86_64.pkg.tar.zst' --dir previous-release
          previous_package="$(find previous-release -maxdepth 1 -name 'omakade-*-x86_64.pkg.tar.zst' -print -quit)"
          test -n "$previous_package"
          pacman -U --noconfirm "$previous_package"
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software omakade --smoke-test
          pacman -U --noconfirm "$package_file"
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software omakade --smoke-test
          pacman -U --noconfirm "$package_file"
          pacman -R --noconfirm omakade
          test ! -e /usr/bin/omakade
          pacman -U --noconfirm "$package_file"
          cp packaging/arch/omakade-*.pkg.tar.zst .
          cp packaging/arch/PKGBUILD "PKGBUILD-$VERSION"
          sha256sum "omakade-$VERSION.tar.gz" omakade-*.pkg.tar.zst "PKGBUILD-$VERSION" > SHA256SUMS
          awk -v heading="## $VERSION" '$0 == heading {copy=1; next} /^## /{copy=0} copy' \
            CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "omakade-$VERSION.tar.gz"
          omakade-*.pkg.tar.zst
          "PKGBUILD-$VERSION"
          SHA256SUMS
          --repo "$GITHUB_REPOSITORY"
          --title "Omakade $VERSION"
          --notes-file RELEASE_NOTES.md
