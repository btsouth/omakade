name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Compiler output is validated against source/dependencies and compiler
  # content by ccache; package builds stay clean and all tests still run.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 500M
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  build-and-test:
    timeout-minutes: 30
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            container: archlinux@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a
          - arch: aarch64
            runner: ubuntu-24.04-arm
            container: menci/archlinuxarm:base-devel@sha256:5dda87d4b360dff28fe5ce27a20041949aa770a785c52daf82fc9956b2534c39
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Install dependencies
        run: >-
          pacman -Syu --disable-sandbox --noconfirm --needed
          appstream base-devel ccache cmake desktop-file-utils git libsecret libzip ninja
          pkgconf python qt6-base qt6-declarative qt6-imageformats qt6-svg sdl3
          ttf-dejavu wayland wayland-protocols
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache compiler outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release --parallel 4 --output-junit test-results.xml
      - name: Test release tooling
        run: python tests/SbomGeneratorTests.py
      - name: Validate metadata
        run: |
          desktop-file-validate packaging/io.github.tsouth89.Omakade.desktop
          appstreamcli validate packaging/io.github.tsouth89.Omakade.metainfo.xml
      - name: Verify staged install
        run: |
          cmake --install build/release --prefix "$PWD/stage/usr"
          test -x stage/usr/bin/omakade
          test -f stage/usr/share/applications/io.github.tsouth89.Omakade.desktop
          test -f stage/usr/share/metainfo/io.github.tsouth89.Omakade.metainfo.xml
          test -f stage/usr/share/omakade/skills/omakade-tv-gaming/SKILL.md
          test -f stage/usr/share/omakade/skills/omakade-tv-gaming/references/session.md
          test -x stage/usr/share/omakade/skills/omakade-tv-gaming/scripts/omakade-tv-game.py
          stage/usr/share/omakade/skills/omakade-tv-gaming/scripts/omakade-tv-game.py --help
          desktop-file-validate stage/usr/share/applications/io.github.tsouth89.Omakade.desktop
          appstreamcli validate stage/usr/share/metainfo/io.github.tsouth89.Omakade.metainfo.xml
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ github.job }}-${{ runner.arch }}
          path: '**/test-results.xml'
          if-no-files-found: ignore
          retention-days: 7
