name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Compiler output is validated against source/dependencies and compiler
  # content by ccache; package builds stay clean and all tests still run.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # Preserve absolute __FILE__ paths: source-inspection tests run from tests/.
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 500M
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - name: Check changed files
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Markdown is installed as-is and never compiled or tested. Renames
          # and deletions still build because install rules list the files.
          docs_only=false
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | "\(.status)\t\(.filename)"')
            if [ -n "$files" ]; then
              docs_only=true
              while IFS=$'\t' read -r status file; do
                case "$status:$file" in
                  modified:*.md | added:*.md) ;;
                  *) docs_only=false ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Docs-only change: $docs_only"

  docs-only:
    # Reports the required build check names for Markdown-only pull requests.
    name: Build and test (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.docs-only == 'true'
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    steps:
      - name: Skip build
        run: echo "Only Markdown changed, so the build and tests are skipped."

  build-and-test:
    needs: changes
    # Still builds if change detection fails.
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    timeout-minutes: 30
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            container: archlinux@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a
          - arch: aarch64
            runner: ubuntu-24.04-arm
            container: menci/archlinuxarm:base-devel@sha256:5dda87d4b360dff28fe5ce27a20041949aa770a785c52daf82fc9956b2534c39
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Install dependencies
        run: >-
          pacman -Syu --disable-sandbox --noconfirm --needed
          appstream base-devel ccache cmake desktop-file-utils git layer-shell-qt libsecret libzip ninja
          pkgconf python qt6-base qt6-declarative qt6-imageformats qt6-svg sdl3
          ttf-dejavu wayland wayland-protocols
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Restore compiler outputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release --parallel 4 --output-junit test-results.xml
      - name: Test release tooling
        run: python tests/SbomGeneratorTests.py
      - name: Validate metadata
        run: |
          desktop-file-validate packaging/io.github.tsouth89.Omakade.desktop
          appstreamcli validate packaging/io.github.tsouth89.Omakade.metainfo.xml
      - name: Verify staged install
        run: |
          cmake --install build/release --prefix "$PWD/stage/usr"
          test -x stage/usr/bin/omakade
          test -x stage/usr/bin/omakade-guide-button
          test -f stage/usr/lib/systemd/user/omakade-guide-button.service
          stage/usr/bin/omakade-guide-button --help
          test -f stage/usr/share/applications/io.github.tsouth89.Omakade.desktop
          test -f stage/usr/share/metainfo/io.github.tsouth89.Omakade.metainfo.xml
          test -f stage/usr/share/omakade/skills/omakade-tv-gaming/SKILL.md
          test -f stage/usr/share/omakade/skills/omakade-tv-gaming/references/session.md
          test -x stage/usr/share/omakade/skills/omakade-tv-gaming/scripts/omakade-tv-game.py
          stage/usr/share/omakade/skills/omakade-tv-gaming/scripts/omakade-tv-game.py --help
          desktop-file-validate stage/usr/share/applications/io.github.tsouth89.Omakade.desktop
          appstreamcli validate stage/usr/share/metainfo/io.github.tsouth89.Omakade.metainfo.xml
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Save compiler outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ github.job }}-${{ runner.arch }}
          path: '**/test-results.xml'
          if-no-files-found: ignore
          retention-days: 7
