name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Compiler output is validated against source/dependencies and compiler
  # content by ccache; package builds stay clean and all tests still run.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # CCACHE_BASEDIR stays unset here and in release.yml: source-inspection tests read
  # absolute __FILE__ paths, and the release tests reuse the outputs saved on main.
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 500M
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - name: Check changed files
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Markdown is installed as-is and never compiled or tested. Renames
          # and deletions still build because install rules list the files.
          docs_only=false
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | "\(.status)\t\(.filename)"')
            if [ -n "$files" ]; then
              docs_only=true
              while IFS=$'\t' read -r status file; do
                case "$status:$file" in
                  modified:*.md | added:*.md) ;;
                  *) docs_only=false ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Docs-only change: $docs_only"

  docs-only:
    # Reports the required build check names for Markdown-only pull requests.
    name: Build and test (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.docs-only == 'true'
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    steps:
      - name: Skip build
        run: echo "Only Markdown changed, so the build and tests are skipped."

  build-and-test:
    needs: changes
    # Still builds if change detection fails.
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    timeout-minutes: 30
    name: Test (${{ matrix.check }}, shard ${{ matrix.shard }})
    # Current Arch only warns about newer Qt, so it can't block a merge.
    continue-on-error: ${{ matrix.check == 'x86_64 current Arch' }}
    strategy:
      fail-fast: false
      matrix:
        # Each leg runs half the tests on its own runner, because most of a test's time
        # is waiting and a 4 vCPU runner only fits so many at once. Every leg still builds.
        check: [x86_64, x86_64 current Arch, aarch64]
        shard: [1, 2]
        # x86_64 releases build on Omarchy stable, so the required x86_64 check
        # does too. Current Arch catches newer Qt early.
        include:
          - check: x86_64
            arch: x86_64
            packages: omarchy-stable
            # The clip trim test needs ffmpeg, and a required leg has to run it.
            ffmpeg: true
            runner: ubuntu-24.04
            container: archlinux@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a
          - check: x86_64 current Arch
            arch: x86_64
            packages: arch
            runner: ubuntu-24.04
            container: archlinux@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a
          - check: aarch64
            arch: aarch64
            packages: arch
            runner: ubuntu-24.04-arm
            container: menci/archlinuxarm:base-devel@sha256:5dda87d4b360dff28fe5ce27a20041949aa770a785c52daf82fc9956b2534c39
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Use Omarchy stable packages
        if: matrix.packages == 'omarchy-stable'
        run: |
          # shellcheck disable=SC2016 # $repo and $arch are for pacman, not the shell.
          echo 'Server = https://stable-mirror.omarchy.org/$repo/os/$arch' > /etc/pacman.d/mirrorlist
      - name: Install dependencies
        # -uu lets the stable snapshot downgrade packages newer than it.
        run: >-
          pacman -Syyuu --disable-sandbox --noconfirm --needed
          appstream base-devel ccache cmake desktop-file-utils git layer-shell-qt libsecret libzip ninja
          pkgconf python qt6-base qt6-declarative qt6-imageformats qt6-svg sdl3
          ttf-dejavu wayland wayland-protocols
          ${{ matrix.ffmpeg && 'ffmpeg' || '' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Restore compiler outputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-v2-${{ matrix.packages }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-v2-${{ matrix.packages }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Add an unprivileged test user
        # As root, the cases that check unreadable files and device nodes would skip.
        run: |
          useradd --create-home tester
          chown -R tester:tester "$GITHUB_WORKSPACE"
      - name: Test
        # Every second test, so the shards together cover the whole suite.
        run: >-
          runuser -u tester --
          ctest --preset release --parallel 8 -I ${{ matrix.shard }},,2 --output-junit test-results.xml
      - name: Require the permission cases
        # ctest counts a QSKIP as a pass, so check that these really ran.
        if: matrix.shard == 1
        run: |
          runuser -u tester -- python tools/ci/require-qt-cases.py \
            build/release/tests/omakade_guide_button_tests listenerRetriesAControllerItCannotOpenYet
          runuser -u tester -- python tools/ci/require-qt-cases.py \
            build/release/tests/omakade_save_set_tests unreadableFoldersRefuseSnapshotAndRestore
      - name: Require the clip trim case
        if: matrix.shard == 1 && matrix.ffmpeg
        run: >-
          runuser -u tester -- python tools/ci/require-qt-cases.py
          build/release/tests/omakade_highlight_tests serviceTrimsGuideTime
      - name: Test release tooling
        if: matrix.shard == 1
        run: |
          python tests/SbomGeneratorTests.py
          python tools/ci/CiToolsTests.py
      - name: Validate metadata
        if: matrix.shard == 1
        run: |
          desktop-file-validate packaging/io.github.tsouth89.Omakade.desktop
          appstreamcli validate packaging/io.github.tsouth89.Omakade.metainfo.xml
      - name: Verify staged install
        if: matrix.shard == 1
        run: |
          cmake --install build/release --prefix "$PWD/stage/usr"
          test -x stage/usr/bin/omakade
          test -x stage/usr/bin/omakade-guide-button
          test -f stage/usr/lib/systemd/user/omakade-guide-button.service
          stage/usr/bin/omakade-guide-button --help
          test -f stage/usr/share/applications/io.github.tsouth89.Omakade.desktop
          test -f stage/usr/share/metainfo/io.github.tsouth89.Omakade.metainfo.xml
          test -f stage/usr/share/omakade/skills/omakade-tv-gaming/SKILL.md
          test -f stage/usr/share/omakade/omarchy-plugin/manifest.json
          test -f stage/usr/share/omakade/omarchy-plugin/Guide.qml
          test ! -e stage/usr/share/omakade/omarchy-plugin/__pycache__
          test -f stage/usr/share/omakade/skills/omakade-tv-gaming/references/session.md
          test -x stage/usr/share/omakade/skills/omakade-tv-gaming/scripts/omakade-tv-game.py
          stage/usr/share/omakade/skills/omakade-tv-gaming/scripts/omakade-tv-game.py --help
          desktop-file-validate stage/usr/share/applications/io.github.tsouth89.Omakade.desktop
          appstreamcli validate stage/usr/share/metainfo/io.github.tsouth89.Omakade.metainfo.xml
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Save compiler outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shard == 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-v2-${{ matrix.packages }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ github.job }}-${{ matrix.packages }}-${{ runner.arch }}-${{ matrix.shard }}
          path: '**/test-results.xml'
          if-no-files-found: ignore
          retention-days: 7

  build-and-test-result:
    # Reports the required check names, so branch protection doesn't depend on the shards.
    name: Build and test (${{ matrix.check }})
    needs: [changes, build-and-test]
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    strategy:
      matrix:
        check: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every shard
        env:
          RESULT: ${{ needs.build-and-test.result }}
        run: test "$RESULT" = success
